<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #232f3e, #131921);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
            color: #232f3e;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        .btn {
            background: #f08804;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
            color: #007185;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Login</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>

        <button class="btn">Login</button>
    </form>

    <p>New user? <a href="/signup">Create account</a></p>

</div>

</body>
</html>
