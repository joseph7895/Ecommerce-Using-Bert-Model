<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Confirm Purchase</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --accent: #10b981;
            --bg-grad: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --nav-bg: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0 25px 50px -12px rgba(79, 70, 229, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 🌈 NAVBAR */
        .navbar {
            background: var(--nav-bg);
            padding: 18px 4%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }

        .logo-icon {
            color: var(--primary-light);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* CONTAINER */
        .container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: auto;
            padding: 40px 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid #f1f5f9;
            display: flex;
            gap: 30px;
            align-items: center;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .card img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 16px;
            background: #f8fafc;
            padding: 15px;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
        }

        .info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
        }

        /* BUTTON */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        /* BACK LINK */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 25px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: var(--primary-dark);
        }

        /* CHECKOUT BOX */
        .checkout-box {
            background: #f8fafc;
            padding: 18px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px solid #e2e8f0;
        }

        .checkout-box span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* RESPONSIVE */
        @media(max-width: 700px){
            .card {
                flex-direction: column;
                text-align: center;
                padding: 25px;
            }

            .card img {
                width: 100%;
                height: 220px;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo-container">
        <i data-lucide="shopping-bag" class="logo-icon" size="28"></i>
        <span class="logo">ShopSmart</span>
    </a>
</nav>

<div class="container">
    <h2>
        <i data-lucide="shield-check" style="color: var(--accent)" size="28"></i>
        Confirm Your Purchase
    </h2>

    <div class="card">
        <img src="{{ product.get('img_link') if product.get('img_link') else 'https://via.placeholder.com/200?text=Product+Image' }}"
             alt="{{ product['product_name'] }}"
             onerror="this.onerror=null;this.src='https://via.placeholder.com/200?text=Product+Image';">

        <div class="info">
            <div class="title">{{ product['product_name'] }}</div>
            <div class="price">₹{{ product['discounted_price'] }}</div>

            <div class="checkout-box">
                <span><i data-lucide="lock" size="14" style="color: var(--accent)"></i> 256-bit Secure Encryption SSL Connection</span>
                <span><i data-lucide="truck" size="14" style="color: var(--primary-light)"></i> Fast Delivery (Expected: 3-5 Business Days)</span>
                <span><i data-lucide="rotate-ccw" size="14" style="color: var(--primary-light)"></i> 15-Day Easy Refund & Replacement Warranty</span>
            </div>

            <form method="POST">
                <button type="submit" class="btn">
                    <i data-lucide="check-circle" size="18"></i>
                    Confirm & Authorize Purchase
                </button>
            </form>
        </div>
    </div>

    <a href="/cart" class="back">
        <i data-lucide="arrow-left" size="16"></i>
        <span>Back to Cart</span>
    </a>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
