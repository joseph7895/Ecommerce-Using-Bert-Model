<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSmart — Smart Sentiment Shopping</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --accent: #10b981;
            --bg-grad: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --nav-bg: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0 25px 50px -12px rgba(79, 70, 229, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 🌈 NAVBAR */
        .navbar {
            background: var(--nav-bg);
            padding: 18px 4%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }

        .logo-icon {
            color: var(--primary-light);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .search-form {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-box {
            display: flex;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 4px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 8px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-box button {
            background: var(--primary);
            border: none;
            cursor: pointer;
            color: white;
            border-radius: 20px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .search-box button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* 🎯 CATEGORY BAR */
        .filter-section {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 14px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-form select {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .filter-form select:hover {
            border-color: #94a3b8;
            background-color: #f1f5f9;
        }

        .filter-form select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* 🧱 PRODUCT GRID */
        .main-container {
            flex: 1;
            padding: 30px 4%;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* 🛍️ PRODUCT CARD */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid #f1f5f9;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(79, 70, 229, 0.1);
        }

        .card:hover::before {
            opacity: 1;
        }

        .image-wrapper {
            background: #f8fafc;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            margin-bottom: 18px;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .card:hover .image-wrapper {
            background: #f1f5f9;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.06);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            height: 45px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
        }

        .price-section {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .price {
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
        }

        .rating-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .rating {
            background: #fffbeb;
            color: #d97706;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #fde68a;
        }

        .reviews {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .search-form {
                width: 100%;
                margin: 0;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo-container">
        <i data-lucide="shopping-bag" class="logo-icon" size="28"></i>
        <span class="logo">ShopSmart</span>
    </a>

    <form method="GET" action="/" class="search-form">
        <div class="search-box">
            <input type="text" name="search" placeholder="Find smart products & analysis...">
            <button type="submit">
                <i data-lucide="search" size="18"></i>
            </button>
        </div>
    </form>

    <div class="nav-links">
        <a href="/cart" class="nav-btn">
            <i data-lucide="shopping-cart" size="18"></i>
            <span>Cart</span>
        </a>
        <a href="/orders" class="nav-btn">
            <i data-lucide="package" size="18"></i>
            <span>Orders</span>
        </a>
    </div>
</nav>

<div class="filter-section">
    <div class="section-title">
        <i data-lucide="sparkles" size="18" style="color: var(--primary);"></i>
        <span>Explore Curated Deals</span>
    </div>
    <form method="GET" action="/" class="filter-form">
        <select name="category" onchange="this.form.submit()">
            <option value="">All Categories</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Home</option>
            <option>Accessories</option>
        </select>
    </form>
</div>

<main class="main-container">
    <div class="grid-container">
        {% for p in products %}
        <a href="/product/{{ loop.index0 }}" class="card-link">
            <div class="card">
                <div class="image-wrapper">
                    <img src="{{ p.get('img_link') }}" 
                         alt="{{ p.get('product_name','Product Image') }}"
                         onerror="this.onerror=null;this.src='https://via.placeholder.com/300?text=Product+Image';">
                </div>

                <div class="product-info">
                    <h3>{{ p.get('product_name','No Name') }}</h3>
                </div>

                <div class="card-meta">
                    <div class="price-section">
                        <span class="price-label">Price</span>
                        <span class="price">₹{{ p.get('discounted_price','0') }}</span>
                    </div>

                    <div class="rating-box">
                        <span class="rating">
                            <i data-lucide="star" size="14" fill="#d97706"></i>
                            {{ p.get('rating','4') }}
                        </span>
                        <span class="reviews">{{ p.get('rating_count','100') }} ratings</span>
                    </div>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</main>

<script>
    lucide.createIcons();
</script>
</body>
</html>
